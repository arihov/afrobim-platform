name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# The Transport fonts are user-supplied and never committed, so both jobs run the
# suite on the DejaVu fixtures in tests/fixtures/fonts; the exact-metric tests skip.

jobs:
  test-linux:
    # Everything except the WPF app (net10.0-windows), which only builds on Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        id: dotnet
        with:
          dotnet-version: 10.0.x

      # Runner images carry newer SDKs too; build with the one just installed.
      - name: Pin SDK
        run: dotnet new globaljson --sdk-version ${{ steps.dotnet.outputs.dotnet-version }} --force

      - name: Restore
        run: |
          dotnet restore tests/SignCore.Tests/SignCore.Tests.csproj
          dotnet restore tools/VerifyRoundTrip/VerifyRoundTrip.csproj

      - name: Build
        run: |
          dotnet build tests/SignCore.Tests/SignCore.Tests.csproj -c Release --no-restore
          dotnet build tools/VerifyRoundTrip/VerifyRoundTrip.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/SignCore.Tests/SignCore.Tests.csproj -c Release --no-build

  build-windows:
    # Whole solution, including the WPF desktop app.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        id: dotnet
        with:
          dotnet-version: 10.0.x

      - name: Pin SDK
        run: dotnet new globaljson --sdk-version ${{ steps.dotnet.outputs.dotnet-version }} --force

      - name: Build
        run: dotnet build SignCore.sln -c Release

      - name: Test
        run: dotnet test SignCore.sln -c Release --no-build

      # WPF cannot be unit-tested on Linux, so load every window for real: the smoke run parses the
      # XAML, lays the CAD workspace out with signs on the canvas and writes a screenshot.
      - name: UI smoke test
        shell: pwsh
        timeout-minutes: 5
        env:
          SIGNCORE_FONTS_DIR: ${{ github.workspace }}\fonts
        run: |
          $exe = Get-ChildItem -Recurse -Path src/SignCore.App/bin/Release -Filter SignCore.App.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-dialogs' -Wait -PassThru
          $dir = Split-Path $exe.FullName
          if (Test-Path "$dir/smoke-result.txt") { Get-Content "$dir/smoke-result.txt" }
          New-Item -ItemType Directory -Force -Path smoke-out | Out-Null
          Copy-Item "$dir/smoke-*.*" smoke-out -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "UI smoke test failed with exit code $($p.ExitCode)" }

      - name: Upload UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signcore-ui-smoke
          path: smoke-out
          if-no-files-found: ignore

  afrobim:
    # The Rust platform: one codebase, built and tested on all three desktop systems.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: afrobim
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            afrobim/target
          key: afrobim-${{ matrix.os }}-${{ hashFiles('afrobim/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

  afrobim-python:
    # The Python package: the wheel is built and installed, then pytest runs against it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: afrobim/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            afrobim/python/target
          key: afrobim-python-${{ matrix.os }}-${{ hashFiles('afrobim/python/Cargo.lock', 'afrobim/python/tests/kernel_reference/Cargo.lock') }}

      - name: Install maturin and pytest
        run: python -m pip install --upgrade pip maturin pytest

      - name: Build the wheel
        run: maturin build --release --locked --out dist

      - name: Install the wheel
        run: python -m pip install --no-index --find-links dist afrobim

      - name: Test
        run: python -m pytest

