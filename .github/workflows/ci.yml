name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab to test Windows and macOS as well as Linux.
  workflow_dispatch:
  # Every Monday, Windows and macOS included, so a break on either shows up within a week even
  # though pushes and pull requests test on Linux only. A scheduled run uses the default branch.
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

# A newer push to the same pull request stops the superseded run, which saves minutes (macOS counts 10x,
# Windows 2x). Runs on main are never cancelled, so every commit on main keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Pushes and pull requests test on Linux only. Windows and macOS minutes are billed at 2x and 10x,
# so the full matrix runs only when the workflow is started by hand or by the weekly schedule.

# Every third-party action is pinned to a full commit SHA, with the version it stands for in the
# comment after it. A tag can be moved, a SHA cannot. To update one, look up the commit of the new
# tag (git ls-remote --tags <repository>; an annotated tag lists its commit on the line ending in ^{})
# and change the SHA and the comment together.

# The Transport fonts are user-supplied and never committed, so both jobs run the
# suite on the DejaVu fixtures in tests/fixtures/fonts; the exact-metric tests skip.

jobs:
  afrobim:
    # The Rust platform: one codebase, built and tested on all three desktop systems.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: afrobim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            afrobim/target
          key: afrobim-${{ matrix.os }}-${{ hashFiles('afrobim/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --locked

      # The tests that cross-check against independent tools (ezdxf for DXF, IfcOpenShell for IFC,
      # xmllint for XML, poppler and qpdf for PDF) skip with a printed note when the tool is
      # missing, so a plain runner checks less than it appears to. Installed on Linux only: it is
      # the runner every push and pull request uses, and apt and pip are quick there. A tool that
      # cannot be installed is a warning, not a failure; its tests then skip as before. The
      # xmllint checks against the buildingSMART and LandXML schemas also need the schema files,
      # which are not in the repository, so those still skip.
      - name: Cross-check tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils qpdf libxml2-utils unzip python3-venv
          # The tests start `python3 -I`, which ignores the user site, so the packages go into a
          # virtual environment whose python3 comes first on the path.
          python3 -m venv "$RUNNER_TEMP/xcheck"
          echo "$RUNNER_TEMP/xcheck/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcheck/bin/pip" install --quiet ezdxf || echo "::warning::ezdxf could not be installed, so the ezdxf cross-checks will skip"
          "$RUNNER_TEMP/xcheck/bin/pip" install --quiet ifcopenshell || echo "::warning::ifcopenshell could not be installed, so the IfcOpenShell cross-checks will skip"

      - name: Test
        run: cargo test --workspace --locked

  afrobim-python:
    # The Python package: the wheel is built and installed, then pytest runs against it.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: afrobim/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            afrobim/python/target
          key: afrobim-python-${{ matrix.os }}-${{ hashFiles('afrobim/python/Cargo.lock', 'afrobim/python/tests/kernel_reference/Cargo.lock') }}

      - name: Install maturin and pytest
        run: python -m pip install --upgrade pip maturin pytest

      - name: Build the wheel
        run: maturin build --release --locked --out dist

      - name: Install the wheel
        run: python -m pip install --no-index --find-links dist afrobim

      - name: Test
        run: python -m pytest

  lint:
    # rustfmt and clippy. The older crates were written before either ran in CI, so most of them
    # are neither formatted nor clippy-clean, and a gate on all of them would fail on code nobody
    # has touched. The gate is therefore a list of the crates that pass today: a crate on it stays
    # clean, and a crate is added to it when it has been cleaned. The older crates still run
    # clippy, with every finding shown as a warning, so the work left is visible.
    #
    # The toolchain is pinned: a new stable release brings new lints, and -D warnings would turn
    # them into a failure on a push that touched nothing. Move the pin deliberately, and fix
    # what the new release finds in the same change.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afrobim
    env:
      LINT_TOOLCHAIN: "1.100.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust toolchain (pinned)
        run: |
          rustup toolchain install "$LINT_TOOLCHAIN" --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default "$LINT_TOOLCHAIN"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            afrobim/target
          key: afrobim-lint-${{ hashFiles('afrobim/Cargo.lock') }}

      # Crates that are formatted today: afrobim-mcp only. The other 35 are not, and are left
      # alone so that no commit reformats the repository.
      - name: Format (rustfmt, crates already formatted)
        run: cargo fmt -p afrobim-mcp -- --check

      # Crates with no clippy finding of any level on every target (library, binaries, tests,
      # examples). --no-deps keeps the gate to the named crates, so a finding in an older crate
      # they depend on does not fail it.
      - name: Clippy, warnings are errors (crates already clean)
        run: |
          cargo clippy --locked --all-targets --no-deps \
            -p afrobim-annotate \
            -p afrobim-coordination \
            -p afrobim-corridor \
            -p afrobim-cost \
            -p afrobim-green \
            -p afrobim-ifc \
            -p afrobim-lighting \
            -p afrobim-mcp \
            -p afrobim-progress \
            -p afrobim-raster \
            -p afrobim-restraint \
            -p afrobim-schedule \
            -p afrobim-sheets \
            -p afrobim-visibility \
            -- -D warnings

      # The whole workspace, with every lint capped at a warning (two lints that deny by default,
      # approx_constant in afrobim-drainage's tests and never_loop in afrobim-app, would otherwise
      # fail it). This shows what is left in the older crates and fails only on a compile error.
      - name: Clippy, findings shown as warnings (all crates)
        run: cargo clippy --locked --workspace --all-targets -- --cap-lints warn

  deny:
    # Licences, banned crates and unknown sources, from afrobim/deny.toml. Advisories are left out
    # on purpose: they change without a commit, so they belong in a scheduled job of their own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          manifest-path: afrobim/Cargo.toml
          command: check --config afrobim/deny.toml licenses bans sources
