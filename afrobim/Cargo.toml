[workspace]
resolver = "2"
members = ["crates/afrobim-draw", "crates/afrobim-kernel", "crates/afrobim-signs", "crates/afrobim-dxf", "crates/afrobim-fabrication", "crates/afrobim-mcp", "crates/afrobim-ifc", "crates/afrobim-alignment", "crates/afrobim-supports", "crates/afrobim-markings", "crates/afrobim-gantry", "crates/afrobim-drainage", "crates/afrobim-lighting", "crates/afrobim-restraint", "crates/afrobim-corridor", "crates/afrobim-app"]
# The Python extension is built with maturin and needs a Python toolchain, so it stays outside
# the workspace: `cargo build --workspace` must work on a machine without Python.
exclude = ["python"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["AfroBIM"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
