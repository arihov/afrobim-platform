[workspace]
resolver = "2"
members = ["crates/afrobim-draw", "crates/afrobim-kernel", "crates/afrobim-signs", "crates/afrobim-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["AfroBIM"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
