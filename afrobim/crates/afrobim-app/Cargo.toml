[package]
name = "afrobim-app"
description = "AfroBIM desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "afrobim"
path = "src/main.rs"

[dependencies]
afrobim-draw = { path = "../afrobim-draw" }
afrobim-kernel = { path = "../afrobim-kernel" }
afrobim-signs = { path = "../afrobim-signs" }
afrobim-dxf = { path = "../afrobim-dxf" }
afrobim-ifc = { path = "../afrobim-ifc" }
afrobim-fabrication = { path = "../afrobim-fabrication" }
afrobim-supports = { path = "../afrobim-supports" }
afrobim-markings = { path = "../afrobim-markings" }
afrobim-drainage = { path = "../afrobim-drainage" }
afrobim-gantry = { path = "../afrobim-gantry" }
afrobim-alignment = { path = "../afrobim-alignment" }
afrobim-lighting = { path = "../afrobim-lighting" }
afrobim-restraint = { path = "../afrobim-restraint" }
afrobim-corridor = { path = "../afrobim-corridor" }
afrobim-pavement = { path = "../afrobim-pavement" }
afrobim-coordination = { path = "../afrobim-coordination" }
afrobim-schedule = { path = "../afrobim-schedule" }
afrobim-cost = { path = "../afrobim-cost" }
afrobim-progress = { path = "../afrobim-progress" }
afrobim-sheets = { path = "../afrobim-sheets" }
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.31"
lyon_tessellation = "1"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
