[package]
name = "afrobim-sheets"
description = "Documentation stage: composes drawing sheets (plan, profile, sections, tables, details, notes) with title blocks from the live model, and writes them as PDF and DXF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
afrobim-draw = { path = "../afrobim-draw" }
afrobim-kernel = { path = "../afrobim-kernel" }
afrobim-alignment = { path = "../afrobim-alignment" }
afrobim-corridor = { path = "../afrobim-corridor" }
afrobim-dxf = { path = "../afrobim-dxf" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Already used by afrobim-fabrication for its PDF streams.
flate2 = "1.1.11"

[dev-dependencies]
afrobim-markings = { path = "../afrobim-markings" }
afrobim-schedule = { path = "../afrobim-schedule" }
